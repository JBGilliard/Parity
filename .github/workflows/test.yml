name: test

on:
  push:
  pull_request:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev --frozen
      - name: Test
        run: uv run pytest -q
      - name: Reproduce golden corpus
        run: uv run parity reproduce
